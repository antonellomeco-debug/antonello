<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d16" />
  <title>Server non raggiungibile · I miei agenti</title>
  <!-- Pagina mostrata dal service worker quando il server non risponde: tutto è qui dentro, niente file esterni. -->
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: radial-gradient(ellipse at 50% 30%, #1b1f36, #0b0d16 70%); color: #e9ebf6;
      display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    main { width: min(420px, 100%); text-align: center; }
    svg { width: 96px; height: 96px; }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    p { color: #8a90b2; line-height: 1.5; margin: 0 0 10px; font-size: 15px; }
    .btn {
      display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 22px; border-radius: 14px;
      background: linear-gradient(135deg, #6f7dff, #a46bff); color: #fff; font-weight: 600; font-size: 17px; text-decoration: none;
    }
    .btn:active { opacity: .85; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <radialGradient id="o" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#b7c0ff"/><stop offset=".62" stop-color="#6f7dff"/><stop offset="1" stop-color="#2b2f6e"/></radialGradient>
      </defs>
      <rect x="249" y="150" width="14" height="216" rx="7" fill="#b7c0ff"/>
      <ellipse cx="256" cy="352" rx="150" ry="44" fill="#6f7dff" fill-opacity=".16" stroke="#6f7dff" stroke-width="8"/>
      <ellipse cx="256" cy="282" rx="150" ry="44" fill="#a46bff" fill-opacity=".16" stroke="#a46bff" stroke-width="8"/>
      <ellipse cx="256" cy="212" rx="150" ry="44" fill="#ffc94d" fill-opacity=".16" stroke="#ffc94d" stroke-width="8"/>
      <circle cx="256" cy="128" r="46" fill="url(#o)"/>
    </svg>
    <h1>Server non raggiungibile</h1>
    <p>Controlla la connessione a internet (Wi-Fi o dati mobili) e riprova.</p>
    <p>Se la connessione funziona, il server potrebbe essere in riavvio: aspetta un minuto.</p>
    <a class="btn" href="/">↻ Riprova</a>
  </main>
</body>
</html>
